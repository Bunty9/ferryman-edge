[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/server",
    "examples/edge-demo",
    "examples/embed-core",
]

[workspace.package]
edition = "2021"
version = "0.1.2"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["Bunty9"]
repository = "https://github.com/Bunty9/ferryman-edge"
homepage = "https://bunty9.github.io/ferryman-edge/"
keywords = ["mtls", "reverse-proxy", "jwt", "rustls", "rate-limit"]
categories = ["network-programming", "web-programming::http-server", "authentication"]

[workspace.dependencies]
# Runtime + HTTP
tokio = { version = "1.47", features = ["full"] }
hyper = { version = "1.5", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http = "1"
http-body-util = "0.1"
bytes = "1"

# TLS termination + mTLS (P4 core)
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
tokio-rustls = "0.26"

# Auth + rate limit (P4 additions over P2)
jsonwebtoken = "9"
moka = { version = "0.12", features = ["future"] }
governor = "0.7"

# HTTP client (active health checker + benches)
reqwest = { version = "0.12", default-features = false }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Concurrency primitives
arc-swap = "1.7"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.16"

# Errors
anyhow = "1"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Examples only (examples/*, publish = false)
axum = "0.8"
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs", "pem"] }

# dev-dependencies that any workspace member may opt in to via
# `[dev-dependencies]` + `workspace = true`.
[workspace.dependencies.criterion]
version = "0.5"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
