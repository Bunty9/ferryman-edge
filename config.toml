# ferryman-edge config. Hot-reloaded on SIGUSR1 (routes, top-level timeouts,
# TLS material and the JWT key); [limits], [jwt] issuer/audience,
# health_interval_secs and keepalive_timeout_secs are boot-only.
#
# mTLS terminate -> JWT verify (RS256, moka-cached) -> per-tenant rate limit
# (governor, keyed by Claims.sub) -> prefix-longest-match routing with a
# per-upstream circuit breaker. Reload with:
#   kill -USR1 $(pidof ferryman-edge-server)

health_interval_secs = 5
default_cooldown_secs = 30
# Commented values are the defaults (1..=86400 seconds).
# upstream_timeout_secs          = 30   # end of upload -> response head
# keepalive_timeout_secs         = 10   # HTTP/1 idle keep-alive
# request_body_idle_timeout_secs = 30   # longest gap between body frames
# request_body_timeout_secs      = 300  # whole upload

[limits]
tenant_rps = 1000                       # per JWT `sub`; 0 disables
# max_request_body_bytes     = 8388608  # optional cap; unset = no cap
# tls_handshake_timeout_secs = 10
# first_request_timeout_secs = 10
# h2_max_concurrent_streams  = 64
# shutdown_drain_secs        = 25

[mtls]
cert_path      = "certs/server.crt"
key_path       = "certs/server.key"
client_ca_path = "certs/ca-bundle.crt"

[jwt]
jwks_path = "certs/jwt-pub.pem"
# Strongly recommended outside local dev: without these, any token signed by
# the issuer key is accepted, whichever service it was minted for. Mint
# matching test tokens with JWT_ISS=... JWT_AUD=... scripts/mint-jwt.sh.
# issuer   = "https://issuer.example"
# audience = "ferryman-edge"

[[routes]]
prefix = "/svc-a"
upstream = "http://localhost:8001"
# Per-route health probing (reloaded on SIGUSR1):
# health_path     = "/health"   # must start with "/", no ? or #
# health_disabled = false

[[routes]]
prefix = "/svc-b"
upstream = "http://localhost:8002"
