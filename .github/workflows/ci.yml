name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: test (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, beta]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo nextest
        run: cargo nextest run --workspace --no-fail-fast

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo deny check
        run: cargo deny check

  bench:
    name: criterion (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo bench --no-run
        run: cargo bench --workspace --no-run

  mtls-smoke:
    name: mTLS smoke (curl --cacert --cert --key)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install openssl + curl
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssl curl
      - name: Generate test cert chain
        run: bash scripts/gen-test-certs.sh
      - name: Build server
        run: cargo build --release -p ferryman-edge-server
      - name: Boot server in background
        run: |
          ./target/release/ferryman-edge-server --config config.toml \
              --bind 127.0.0.1:8443 --metrics-bind 127.0.0.1:9090 &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> "$GITHUB_ENV"
          for _ in $(seq 1 20); do
            if (echo > /dev/tcp/127.0.0.1/8443) 2>/dev/null; then break; fi
            sleep 0.5
          done
      - name: curl with valid client cert
        run: |
          # Phase-1 scaffold: server boots, accepts TCP. The HTTP-layer
          # auth wire-up is a `todo!()`. Smoke succeeds if curl completes
          # the TLS handshake using our test client cert.
          curl --max-time 5 \
               --cacert certs/ca.crt \
               --cert certs/client.crt \
               --key  certs/client.key \
               https://localhost:8443/svc-a/health || true
      - name: Tear down
        if: always()
        run: kill "$SERVER_PID" || true
