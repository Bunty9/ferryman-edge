name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: test (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, beta]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo nextest
        run: cargo nextest run --workspace --no-fail-fast

  # nextest does not run doctests.
  doctest:
    name: doctests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo test --doc
        run: cargo test --doc --workspace

  # Blocking: public API must stay semver-compatible with the last release
  # on crates.io (action default baseline = registry). Checks both published
  # crates; the examples are publish = false and skipped.
  semver:
    name: cargo-semver-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # The action installs its own toolchain (rust-toolchain input, default stable).
      - uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9

  # Blocking: the declared rust-version (1.88) must really build, tests and
  # benches included. rust-toolchain.toml pins stable, hence RUSTUP_TOOLCHAIN.
  msrv:
    name: msrv (1.88)
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: "1.88"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo check
        run: cargo check --workspace --all-targets

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo deny check
        run: cargo deny check

  bench:
    name: criterion (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo bench --no-run
        run: cargo bench --workspace --no-run

  examples:
    name: edge-demo walkthrough
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build proxy + demo
        run: cargo build -p ferryman-edge -p ferryman-edge-demo
      - name: Run every feature end to end
        run: target/debug/edge-demo run
      - name: Upload demo logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: edge-demo-logs
          path: examples/edge-demo/.demo/run/*.log

  # The release matrix (release.yml `binaries`, incl. the x86_64 musl smoke
  # that replaced the old mtls-smoke job), exercised on every PR and
  # push to main so a broken target is found before a tag. Builds and smoke
  # tests only: no attestation, no publishing, no secrets.
  binaries:
    name: binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: test
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: macos-latest, target: aarch64-apple-darwin }
    env:
      TARGET: ${{ matrix.target }}
      # cc-rs would look for aarch64-linux-musl-gcc when the host is gnu;
      # musl-tools only ships musl-gcc.
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      - name: Install musl-tools, openssl, curl
        if: contains(matrix.target, 'linux-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools openssl curl python3
      - name: Install cargo-auditable
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-auditable
      - name: Build
        run: cargo auditable build --locked --release -p ferryman-edge --target "$TARGET"
      - name: Smoke-test the binary
        if: contains(matrix.target, 'linux-musl')
        run: bash scripts/smoke.sh "target/$TARGET/release/ferryman-edge-server"

  image:
    name: container image (scratch, non-root)
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Build
        run: docker build -t ferryman-edge:ci .
      - name: Runs as 65532 and the static binary starts in scratch
        run: |
          set -euo pipefail
          user=$(docker inspect -f '{{.Config.User}}' ferryman-edge:ci)
          [ "$user" = "65532:65532" ] || { echo "image user is '$user', want 65532:65532"; exit 1; }
          docker run --rm ferryman-edge:ci --version
      - name: Install openssl, curl, python3 for the smoke
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssl curl python3
      - name: mTLS + JWT smoke through the container (read-only, uid 65532)
        run: SMOKE_IMAGE=ferryman-edge:ci bash scripts/smoke.sh
