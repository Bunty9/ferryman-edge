name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: test (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, beta]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo clippy (boxed_body)
        run: cargo clippy --workspace --all-targets --features ferryman-edge/boxed_body -- -D warnings
      - name: cargo nextest
        run: cargo nextest run --workspace --no-fail-fast
      - name: cargo nextest (boxed_body)
        run: cargo nextest run --workspace --no-fail-fast --features ferryman-edge/boxed_body

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo deny check
        run: cargo deny check

  bench:
    name: criterion (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo bench --no-run
        run: cargo bench --workspace --no-run

  examples:
    name: edge-demo walkthrough (${{ matrix.body }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - body: collected
            features: ""
          - body: boxed_body
            features: "--features ferryman-edge/boxed_body"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build proxy + demo
        run: cargo build -p ferryman-edge -p ferryman-edge-demo ${{ matrix.features }}
      - name: Run every feature end to end
        run: target/debug/edge-demo run
      - name: Upload demo logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: edge-demo-logs-${{ matrix.body }}
          path: examples/edge-demo/.demo/run/*.log

  mtls-smoke:
    name: mTLS smoke (curl --cacert --cert --key)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install openssl + curl
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssl curl python3
      - name: Generate test cert chain
        run: bash scripts/gen-test-certs.sh
      - name: Build server
        run: cargo build --release -p ferryman-edge
      - name: Boot upstream + server in background
        run: |
          mkdir -p /tmp/up/svc-a
          echo ok > /tmp/up/health
          echo hello > /tmp/up/svc-a/hello
          (cd /tmp/up && python3 -m http.server 8001 --bind 127.0.0.1 > /tmp/upstream.log 2>&1 &)
          ./target/release/ferryman-edge-server --config config.toml \
              --bind 127.0.0.1:8443 --metrics-bind 127.0.0.1:9090 > /tmp/server.log 2>&1 &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
          up=0
          for _ in $(seq 1 20); do
            if (echo > /dev/tcp/127.0.0.1/8443) 2>/dev/null; then up=1; break; fi
            sleep 0.5
          done
          [ "$up" = 1 ] || { echo "server did not start"; cat /tmp/server.log; exit 1; }
          # First health tick may race the upstream boot and open the
          # breaker; wait one interval (health_interval_secs = 5).
          sleep 6
      - name: mTLS + JWT smoke
        run: |
          set -euo pipefail
          C="--cacert certs/ca.crt --cert certs/client.crt --key certs/client.key"
          TOKEN=$(bash scripts/mint-jwt.sh smoke-tenant 300)
          code() { curl -s -o /dev/null -w '%{http_code}' --max-time 5 "$@" || true; }
          check() { [ "$1" = "$2" ] || { echo "FAIL $3: got $1 want $2"; exit 1; }; echo "ok $3 ($1)"; }
          check "$(code $C -H "Authorization: Bearer $TOKEN" https://localhost:8443/svc-a/hello)" 200 "valid cert + JWT (h2)"
          check "$(code --http1.1 $C -H "Authorization: Bearer $TOKEN" https://localhost:8443/svc-a/hello)" 200 "valid cert + JWT (h1.1)"
          check "$(code $C https://localhost:8443/svc-a/hello)" 401 "missing JWT"
          check "$(code $C -H 'Authorization: Bearer nope' https://localhost:8443/svc-a/hello)" 401 "bad JWT"
          check "$(code --cacert certs/ca.crt https://localhost:8443/svc-a/hello)" 000 "no client cert"
          check "$(code $C -H "Authorization: Bearer $TOKEN" https://localhost:8443/nope)" 404 "unknown route"
          metrics=$(curl -sf 127.0.0.1:9090/metrics)
          grep -q ferryman_requests_total <<<"$metrics"
          kill -USR1 "$SERVER_PID"; sleep 1
          check "$(code $C -H "Authorization: Bearer $TOKEN" https://localhost:8443/svc-a/hello)" 200 "after SIGUSR1 reload"
      - name: Server logs
        if: failure()
        run: cat /tmp/server.log /tmp/upstream.log || true
      - name: Tear down
        if: always()
        run: kill "$SERVER_PID" || true
