name: release

# Publishes both crates to crates.io when a version tag is pushed, using
# crates.io Trusted Publishing: GitHub's OIDC token is exchanged for a
# crates.io token that lives 30 minutes and is revoked when the job ends.
# No long-lived CARGO_REGISTRY_TOKEN secret exists anywhere.
#
# crates.io side (per crate, Settings -> Trusted Publishing): owner Bunty9,
# repository ferryman-edge, workflow release.yml, environment release.
# GitHub side: environment "release" only accepts tags matching v*.
# Renaming this file or the environment breaks publishing.
#
# Cut a release: bump [workspace.package] version (and server's
# ferryman-edge-core dependency), move CHANGELOG entries under the new
# version, merge to main, then `git tag -a vX.Y.Z -m vX.Y.Z && git push origin vX.Y.Z`.
#
# Jobs: verify -> binaries -> attest -> publish -> release. The only job
# with `contents: write` (release) never holds an OIDC token, and the jobs
# that hold `id-token: write` (attest, publish) never build anything:
# attest checks out nothing and runs no cargo, publish only runs
# `cargo publish --no-verify`. `binaries` runs cargo (third-party build
# scripts) with `contents: read` and no OIDC. There is deliberately no workflow_dispatch trigger: a manual
# run has no tag to verify and nothing to dry-run, and an unintended manual
# run must never be able to reach the publish job.
on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Runs cargo (build scripts, proc macros, tests = arbitrary third-party
  # code), so it only gets `contents: read` and no persisted credentials.
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable

      - name: Tag points at a commit on main
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME (commit $GITHUB_SHA) is not an ancestor of origin/main"
            exit 1
          fi

      - name: Tag matches the workspace version, CHANGELOG has a section
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "ferryman-edge-core") | .version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match workspace version $version"
            exit 1
          fi
          grep -q "^## \[$version\]" CHANGELOG.md || {
            echo "::error::CHANGELOG.md has no section for $version"; exit 1; }
          # Notes are extracted here, before anything irreversible, and
          # reused by the release job.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[.*\]: / { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || {
            echo "::error::CHANGELOG section for $version is empty"; exit 1; }

      - name: Tests
        run: cargo test --workspace --locked

      # Packages and builds each crate in isolation (server resolved against
      # core through a temporary registry), like `cargo publish --dry-run`.
      # Explicit -p: --workspace would also package the publish = false examples.
      - name: Package both crates
        run: cargo package -p ferryman-edge-core -p ferryman-edge --locked

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crates
          path: target/package/*.crate
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 7

  # Release binaries. Runs cargo (third-party build scripts), so read-only,
  # no OIDC. Each Linux binary is smoke-tested (mTLS + JWT + proxy) before
  # it is packaged; macOS runners lack the smoke's openssl flavour.
  # ci.yml's `binaries` job builds the same matrix on every PR.
  binaries:
    name: binary (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: macos-latest, target: aarch64-apple-darwin }
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Install musl-tools
        if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools openssl curl python3
      - name: Install cargo-auditable
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-auditable
      - name: Build
        run: cargo auditable build --locked --release -p ferryman-edge --target "$TARGET"
      - name: Smoke-test the binary
        if: contains(matrix.target, 'linux-musl')
        run: bash scripts/smoke.sh "target/$TARGET/release/ferryman-edge-server"
      - name: Package
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "ferryman-edge") | .version')
          name="ferryman-edge-v${version}-${TARGET}"
          mkdir -p "dist/$name"
          cp "target/${TARGET}/release/ferryman-edge-server" README.md CHANGELOG.md \
            LICENSE-MIT LICENSE-APACHE config.toml "dist/$name/"
          cd dist
          tar -czf "$name.tar.gz" "$name"
          rm -rf "$name"
          if command -v sha256sum >/dev/null; then
            sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          else
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
          cat "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bin-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # Build provenance for the packaged .crate files and every binary archive.
  # The only job (with publish) holding `id-token: write`; it checks out
  # nothing and runs no cargo or repo code. `publish` needs it, so nothing
  # irreversible happens unless attestation succeeded. cargo publish
  # re-packages from the same commit; the attested file is the one verify
  # built, which is what a reviewer can compare against the crates.io download.
  attest:
    needs: [verify, binaries]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: crates
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: bin-*
          path: dist
          merge-multiple: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.crate
            dist/*.tar.gz

  # `id-token: write` mints the crates.io token; `contents: read` only,
  # because cargo publish runs dependency build scripts. Idempotent: a crate
  # whose exact version is already on crates.io is skipped, so re-running
  # after a partial failure resumes instead of failing on "already exists".
  # Any other API answer (429, 5xx, ...) fails the job rather than guessing.
  # --no-verify: verify already packaged and built this exact commit with
  # --locked, and skipping the rebuild keeps dependency build scripts out of
  # the job that holds the crates.io token.
  publish:
    needs: [verify, binaries, attest]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write   # OIDC token for crates.io Trusted Publishing
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: Publish ferryman-edge-core, then ferryman-edge (idempotent)
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "ferryman-edge-core") | .version')
          # ferryman-edge depends on ferryman-edge-core: core goes first.
          for crate in ferryman-edge-core ferryman-edge; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
              -A "ferryman-edge-release (github.com/Bunty9/ferryman-edge)" \
              "https://crates.io/api/v1/crates/${crate}/${version}")
            case "$code" in
              200) echo "$crate $version is already on crates.io, skipping" ;;
              404)
                echo "publishing $crate $version"
                cargo publish -p "$crate" --locked --no-verify ;;
              *)
                echo "::error::crates.io returned HTTP $code for $crate $version"
                exit 1 ;;
            esac
          done

  # Creates (or, on a re-run, updates) the GitHub release. No checkout, no
  # cargo, no repo code; the only job with `contents: write`.
  release:
    needs: [verify, binaries, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-notes
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: crates
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: bin-*
          path: dist
          merge-multiple: true
      - name: Check for every required build
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          missing=0
          for t in x86_64-unknown-linux-musl aarch64-unknown-linux-musl \
                   x86_64-apple-darwin aarch64-apple-darwin; do
            f="dist/ferryman-edge-v${version}-${t}.tar.gz"
            if [ ! -f "$f" ] || [ ! -f "$f.sha256" ]; then
              echo "::error::required build missing: $f"; missing=1
            fi
          done
          [ "$missing" -eq 0 ]
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum ferryman-edge-v*.tar.gz *.crate > SHA256SUMS)
          files=(dist/*.crate dist/ferryman-edge-v*.tar.gz dist/*.sha256 dist/SHA256SUMS)
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME exists, uploading assets"
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber "${files[@]}"
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --notes-file release-notes.md "${files[@]}"
          fi
