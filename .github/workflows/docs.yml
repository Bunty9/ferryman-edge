name: docs

# Builds the mdBook in book/ (which includes README.md, docs/*.md and
# CHANGELOG.md) and deploys it to GitHub Pages. Crate API docs live on
# docs.rs, not here.
on:
  push:
    branches: [main]
    paths:
      - "book/**"
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - "examples/**/README.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.4
      - name: Build book
        run: mdbook build book
      - uses: actions/upload-pages-artifact@v3
        with:
          path: book/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
