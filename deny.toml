# cargo-deny configuration. See: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false
no-default-features = false

[advisories]
version = 2
yanked = "warn"
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
# One TLS provider across the tree: ring. aws-lc-rs needs a C toolchain per
# target and kept the image on glibc/distroless (ROADMAP A2/E7).
deny = [
    { crate = "aws-lc-rs", reason = "ring is the only TLS provider" },
    { crate = "aws-lc-sys", reason = "ring is the only TLS provider" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
