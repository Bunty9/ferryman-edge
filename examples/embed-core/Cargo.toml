[package]
name = "ferryman-edge-embed-example"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Protect your own axum service with ferryman-edge-core: mTLS, JWT middleware, per-tenant rate limiting, hot cert reload."

[dependencies]
ferryman-edge-core = { path = "../../crates/core", version = "0.1" }
axum = { workspace = true }
tokio = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
tokio-rustls = { workspace = true }
rustls = { workspace = true }
http = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
rcgen = { workspace = true }
jsonwebtoken = { workspace = true }
tempfile = "3"
