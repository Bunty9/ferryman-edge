[package]
name = "ferryman-edge-demo"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Runnable end-to-end walkthrough of the ferryman-edge proxy: PKI, tokens, config, sample upstreams, every feature exercised."

[[bin]]
name = "backend"
path = "src/bin/backend.rs"

[[bin]]
name = "edge-demo"
path = "src/bin/edge-demo/main.rs"

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
http-body-util = { workspace = true }
jsonwebtoken = { workspace = true }
rcgen = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls-tls-manual-roots", "http2"] }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
# SHA-256 of the presented server certificate (cert-rotation check).
ring = "0.17"

[dev-dependencies]
# Same repo crates the proxy is built from, by path *and* version: delete
# `path = ...` and this is a plain crates.io dependency.
ferryman-edge-core = { path = "../../crates/core", version = "0.1" }
tempfile = "3"
toml = { workspace = true }
