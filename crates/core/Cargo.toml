[package]
name = "ferryman-edge-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
# Tests and benches need repo-level fixtures (incl. test-only private keys);
# they run in CI from the repository, not from the published crate.
exclude = ["tests/", "benches/"]
description = "Core types for ferryman-edge — mTLS reload, JWT verifier, per-tenant rate limiter and the edge config, over ferryman-core."

[lib]
path = "src/lib.rs"

[dependencies]
# Routing, breaker, health checks and the core config; re-exported as
# `ferryman_edge_core::ferryman_core`.
ferryman-core = { workspace = true }
tokio = { workspace = true }
arc-swap = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# P4 stack additions
rustls = { workspace = true }
jsonwebtoken = { workspace = true }
moka = { workspace = true }
governor = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
criterion = { workspace = true, features = ["async_tokio"] }
tokio = { workspace = true }
jsonwebtoken = { workspace = true }

[[bench]]
name = "jwt_verify"
harness = false
