[package]
name = "ferryman-edge-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
# Tests and benches need repo-level fixtures (incl. test-only private keys);
# they run in CI from the repository, not from the published crate.
exclude = ["tests/", "benches/"]
description = "Core types for ferryman-edge — RouteTable, mTLS reload, JWT verifier, per-tenant rate limiter."

[lib]
path = "src/lib.rs"

[dependencies]
tokio = { workspace = true }
http = { workspace = true }
arc-swap = { workspace = true }
reqwest = { workspace = true, features = ["rustls-tls"] }
serde = { workspace = true }
toml = { workspace = true }
metrics = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }

# P4 stack additions
rustls = { workspace = true }
jsonwebtoken = { workspace = true }
moka = { workspace = true }
governor = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
criterion = { workspace = true, features = ["async_tokio"] }
tokio = { workspace = true }
jsonwebtoken = { workspace = true }

[[bench]]
name = "jwt_verify"
harness = false
