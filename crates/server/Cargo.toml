[package]
name = "ferryman-edge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"
# Tests and benches need repo-level fixtures (incl. test-only private keys);
# they run in CI from the repository, not from the published crate.
exclude = ["tests/", "benches/"]
description = "Programmable mTLS L7 reverse proxy binary — wires ferryman-edge-core behind a tokio-rustls acceptor."

[lib]
path = "src/lib.rs"

[[bin]]
name = "ferryman-edge-server"
path = "src/main.rs"

[features]
# Default: collect the inbound body once, forward as `Full<Bytes>`. Lower
# code complexity and faster for typical JSON payloads under ~256 KB.
default = []
# Streaming body forwarding via `BoxBody`. Lower steady-state allocations
# for large payloads at the cost of code complexity and per-frame overhead.
# See README "Design tradeoffs" for measurements.
boxed_body = []

[dependencies]
ferryman-edge-core = { path = "../core", version = "0.1.2" }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
rustls = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
arc-swap = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }

[dev-dependencies]
jsonwebtoken = { workspace = true }
reqwest = { workspace = true, features = ["rustls-tls-manual-roots", "http2"] }
rcgen = { workspace = true }
tempfile = "3"
