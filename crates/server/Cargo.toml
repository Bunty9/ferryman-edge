[package]
name = "ferryman-edge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"
# Tests and benches need repo-level fixtures (incl. test-only private keys);
# they run in CI from the repository, not from the published crate.
exclude = ["tests/", "benches/"]
description = "Programmable mTLS L7 reverse proxy binary — wires ferryman-edge-core behind a tokio-rustls acceptor."

[lib]
path = "src/lib.rs"

[[bin]]
name = "ferryman-edge-server"
path = "src/main.rs"

# cargo-binstall: fetch the prebuilt archive from the GitHub release
# (built by .github/workflows/release.yml). Unix targets only.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.tar.gz"
bin-dir = "{ name }-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[dependencies]
ferryman-edge-core = { path = "../core", version = "0.1.2" }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
rustls = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
arc-swap = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }

[dev-dependencies]
jsonwebtoken = { workspace = true }
reqwest = { workspace = true, features = ["rustls-tls-manual-roots", "http2"] }
rcgen = { workspace = true }
tempfile = "3"
http-body-util = { workspace = true, features = ["channel"] }
